<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawMind AI Analiz Sayfası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s;
        }

        #canvasContainer {
            aspect-ratio: 4 / 3;
            max-height: 70vh;
        }

        #drawingCanvas {
            cursor: crosshair;
        }

        .report-section-title {
            @apply text-xl font-bold text-indigo-700 mt-4 mb-2 border-b pb-1;
        }

        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 9999px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            border: 3px solid transparent;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.active {
            border-color: #4f46e5;
            transform: scale(1.15);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.4);
        }

        button:disabled {
            @apply opacity-50 cursor-not-allowed transform-none shadow-none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col pt-16 bg-gray-50">

    <!-- Navbar -->
    <nav class="fixed w-full top-0 bg-indigo-700 shadow-xl z-30">
        <div class="relative px-4 sm:px-6 lg:px-8 h-16 flex items-center">
            <div
                class="absolute left-4 sm:left-6 lg:left-8 text-white font-extrabold text-2xl tracking-wider flex items-center">
                <i class="lucide-brain-cog w-6 h-6 mr-2"></i>
                DrawMind AI Analiz
            </div>
            <div class="absolute right-4 sm:right-6 lg:right-8">
                <button onclick="goHome()"
                    class="text-white hover:text-indigo-200 transition duration-150 p-2 rounded-lg text-sm font-medium flex items-center">
                    <i class="lucide-arrow-left w-4 h-4 mr-1"></i> Ana Sayfaya Dön
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center p-4">

        <!-- Drawing Canvas Section -->
        <div id="drawingSection" class="w-full max-w-4xl mx-auto flex flex-col items-center">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-6 text-center">Çiziminizi Yapın</h1>

            <!-- Drawing Controls -->
            <div
                class="w-full max-w-4xl bg-white p-4 rounded-xl shadow-lg mb-4 flex flex-col sm:flex-row justify-between items-center gap-4 border border-indigo-200">

                <!-- Color Palette -->
                <div class="flex items-center space-x-3">
                    <label class="text-gray-700 font-semibold text-sm mr-2 flex items-center"><i
                            class="lucide-palette w-4 h-4 mr-1"></i> Renk Seçimi:</label>
                    <div id="colorPalette" class="flex space-x-2"></div>
                </div>

                <!-- Thickness Slider -->
                <div class="flex items-center space-x-3 w-full sm:w-1/3">
                    <label for="thicknessSlider"
                        class="text-gray-700 font-semibold text-sm flex items-center whitespace-nowrap"><i
                            class="lucide-pen-tool w-4 h-4 mr-1"></i> Kalınlık:</label>
                    <input type="range" id="thicknessSlider" min="1" max="20" value="6" step="1"
                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer range-lg">
                    <span id="thicknessValue" class="text-sm font-medium text-gray-600 w-6 text-right">6</span>
                </div>
            </div>

            <div id="canvasContainer"
                class="w-full shadow-2xl rounded-xl overflow-hidden border-4 border-indigo-500 bg-white relative">
                <canvas id="drawingCanvas" class="w-full h-full"></canvas>
                <div id="loadingOverlay"
                    class="absolute inset-0 bg-black bg-opacity-70 flex items-center justify-center z-10 hidden transition-opacity duration-300">
                    <div
                        class="text-white text-xl font-bold flex flex-col items-center p-8 bg-indigo-800/80 rounded-xl shadow-lg">
                        <i class="lucide-loader-2 w-8 h-8 animate-spin mb-3"></i>
                        AI Tarafından Analiz Ediliyor...
                        <p id="analysisStatus" class="mt-2 text-sm text-indigo-200">Çizim verileri hazırlanıyor...</p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-6 flex gap-3 sm:gap-4 flex-wrap justify-center">
                <button onclick="undo()" id="undoButton" disabled
                    class="bg-gray-300 hover:bg-gray-400 text-gray-800 py-3 px-4 rounded-xl font-bold transition shadow-lg flex items-center text-sm"><i
                        class="lucide-rotate-ccw w-5 h-5 mr-1"></i> Geri Al</button>
                <button onclick="redo()" id="redoButton" disabled
                    class="bg-gray-300 hover:bg-gray-400 text-gray-800 py-3 px-4 rounded-xl font-bold transition shadow-lg flex items-center text-sm"><i
                        class="lucide-rotate-cw w-5 h-5 mr-1"></i> Yinele</button>
                <button onclick="clearCanvas()"
                    class="bg-red-600 hover:bg-red-700 text-white py-3 px-8 rounded-xl font-bold transition shadow-lg hover:shadow-xl transform hover:scale-[1.02] active:scale-95 flex items-center"><i
                        class="lucide-trash-2 w-5 h-5 mr-2"></i> Tümünü Sil</button>
                <button onclick="runAnalysis()" id="analysisButton"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-8 rounded-xl font-bold transition shadow-lg hover:shadow-xl transform hover:scale-[1.02] active:scale-95 flex items-center"><i
                        class="lucide-wand-2 w-5 h-5 mr-2"></i> Analizi Başlat</button>
            </div>

            <p class="mt-4 text-sm text-gray-500 text-center max-w-sm">Lütfen AI'ın analiz edebileceği kadar büyük ve
                belirgin bir çizim yapınız.</p>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden w-full max-w-4xl mx-auto mt-10 text-center">
            <h2 class="text-4xl font-extrabold text-gray-800 mb-6">AI Analiz Raporu</h2>
            <div id="resultCard"
                class="bg-white rounded-xl shadow-2xl p-8 border-2 border-indigo-300 text-gray-700 text-left text-base leading-relaxed">
            </div>
            <div id="citationSources" class="mt-4 text-sm text-gray-500 text-left hidden"></div>
            <button onclick="resetDrawing()"
                class="mt-8 bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-8 rounded-xl font-bold transition shadow-lg hover:shadow-xl transform hover:scale-[1.02] active:scale-95 flex items-center mx-auto"><i
                    class="lucide-pen-tool w-5 h-5 mr-2"></i> Yeni Çizim Yap</button>
        </div>

    </main>

    <footer class="w-full p-4 text-center text-gray-500 text-sm border-t mt-auto">
        DrawMind Bitirme Projesi &copy; 2024 - Gemini Destekli
    </footer>

    <script>
        // Canvas kontrolleri ve değişkenler
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultCard = document.getElementById('resultCard');
        const analysisButton = document.getElementById('analysisButton');
        const analysisStatus = document.getElementById('analysisStatus');
        const thicknessSlider = document.getElementById('thicknessSlider');
        const thicknessValueSpan = document.getElementById('thicknessValue');
        const colorPalette = document.getElementById('colorPalette');
        const undoButton = document.getElementById('undoButton');
        const redoButton = document.getElementById('redoButton');

        let drawing = false;
        let penSettings = { color: '#000000', thickness: 6 };
        let history = [];
        let historyIndex = -1;
        const HISTORY_LIMIT = 50;
        const availableColors = ['#000000', '#FF0000', '#0000FF', '#32C832', '#FFD700', '#9400D3', '#ffa54f', '#8b4513', '#ff34b3', '#8b8b7a'];

        function saveHistory() {
            if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
            history.push(canvas.toDataURL('image/png'));
            historyIndex++;
            if (history.length > HISTORY_LIMIT) { history.shift(); historyIndex--; }
            updateHistoryButtons();
        }

        function loadHistoryState(index) {
            const img = new Image();
            img.onload = function () { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
            img.src = history[index];
            historyIndex = index;
            updateHistoryButtons();
        }

        function undo() { if (historyIndex > 0) loadHistoryState(historyIndex - 1); }
        function redo() { if (historyIndex < history.length - 1) loadHistoryState(historyIndex + 1); }
        function updateHistoryButtons() { undoButton.disabled = historyIndex <= 0; redoButton.disabled = historyIndex >= history.length - 1; }

        function setCanvasSize() { canvas.width = canvasContainer.clientWidth; canvas.height = canvasContainer.clientHeight; ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function createColorPalette() { colorPalette.innerHTML = ''; availableColors.forEach(color => { const swatch = document.createElement('div'); swatch.className = 'color-swatch'; swatch.style.backgroundColor = color; swatch.setAttribute('data-color', color); if (color === penSettings.color) swatch.classList.add('active'); swatch.addEventListener('click', () => selectColor(color)); colorPalette.appendChild(swatch); }); }
        function selectColor(color) { penSettings.color = color; document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active')); document.querySelector(`.color-swatch[data-color="${color}"]`).classList.add('active'); }
        function updateThickness() { penSettings.thickness = parseInt(thicknessSlider.value); thicknessValueSpan.textContent = penSettings.thickness; }

        window.addEventListener('resize', setCanvasSize);
        thicknessSlider.addEventListener('input', updateThickness);

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', endStroke);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
        canvas.addEventListener('touchend', endStroke);
        canvas.addEventListener('touchcancel', stopDrawing);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });

        function startDrawing(e) { drawing = true; ctx.beginPath(); const rect = canvas.getBoundingClientRect(); if (history.length > 0 && historyIndex < history.length - 1) loadHistoryState(historyIndex); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top); }
        function stopDrawing() { drawing = false; }
        function endStroke() { if (drawing) { stopDrawing(); saveHistory(); } }
        function draw(e) { if (!drawing) return; const rect = canvas.getBoundingClientRect(); ctx.lineWidth = penSettings.thickness; ctx.strokeStyle = penSettings.color; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top); }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); history = []; historyIndex = -1; saveHistory(); }
        function base64ToData(base64) { const match = base64.match(/^data:(.+?);base64,(.*)$/); if (!match) return null; return { mimeType: match[1], data: match[2] }; }

        // AI Analiz Fonksiyonu (Backend ile kendi analizini yapabilirsin)
        async function runAnalysis() {
            const base64Url = canvas.toDataURL('image/png');
            const imageData = base64ToData(base64Url);

            if (!imageData || imageData.data.length < 100) {
                resultCard.innerHTML = `<p class="text-red-500 font-semibold">Hata: Lütfen analiz edebileceğim bir şeyler çizin.</p>`;
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('drawingSection').classList.add('hidden');
                return;
            }

            loadingOverlay.classList.remove('hidden');
            analysisButton.disabled = true;
            analysisStatus.textContent = "Analiz yapılıyor...";

            try {
                // Backend URL'nizi değiştirin
                const response = await fetch('http://localhost:8000/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image_data: imageData.data,
                        color_used: penSettings.color,
                        line_thickness: penSettings.thickness
                    })
                });

                if (!response.ok) throw new Error("Backend yanıt vermiyor veya hata döndü.");
                const parsedData = await response.json();

                // Backend'den gelen veriyi rapora yansıt
                renderReport(parsedData);
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('drawingSection').classList.add('hidden');

            } catch (err) {
                resultCard.innerHTML = `<p class="text-red-500 font-semibold">Analiz sırasında bir hata oluştu: ${err.message}</p>`;
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('drawingSection').classList.add('hidden');
            } finally {
                loadingOverlay.classList.add('hidden');
                analysisButton.disabled = false;
            }
        }


        // Bold işaretlerini kaldıracak render fonksiyonu
        function renderReport(data) {
            const cleanText = (text) => text.replace(/\*\*/g, '');
            resultCard.innerHTML = `
                <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-lg mb-4">
                    <p class="text-2xl font-extrabold text-indigo-800 text-center">${cleanText(data.emotion)}</p>
                    <p class="text-sm text-gray-600 text-center mt-1">Duygusal Yoğunluk Profili</p>
                </div>
                <h3 class="report-section-title">Detaylı Psikolojik Yorum</h3>
                <p class="mb-4">${cleanText(data.psychology).replace(/\n/g, '<br>')}</p>
                <h3 class="report-section-title">Renk ve Form Analizi</h3>
                <p class="mb-4">${cleanText(data.colorAnalysis).replace(/\n/g, '<br>')}</p>
                <h3 class="report-section-title">Teknik Skorlar</h3>
                <p class="mb-4 text-sm text-gray-600">${cleanText(data.detail)}</p>
            `;
        }

        function resetDrawing() { document.getElementById('drawingSection').classList.remove('hidden'); document.getElementById('resultSection').classList.add('hidden'); clearCanvas(); }
        function goHome() { window.location.href = 'index.html'; }

        window.onload = () => {
            lucide.createIcons();
            setCanvasSize();
            createColorPalette();
            updateThickness();
            saveHistory();
        };
    </script>
</body>

</html>
