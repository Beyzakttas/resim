<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Giriş Sayfası - Psikolojik Analiz</title>
    <link rel="stylesheet" href="login.css">


</head>

<body>
    <div class="wrap" id="pageWrap">
        <div class="floating-shape" aria-hidden="true">
            <div class="blob b1"></div>
            <div class="blob b2"></div>
        </div>

        <main class="card" role="main" aria-labelledby="title">
            <section class="left" aria-hidden="false">
                <h1 id="title">Hoş geldiniz</h1>
                <p class="lead">Burada güvenli ve yargısız bir alan var. Giriş yapmadan önce derin bir nefes alın —
                    stresinizi dışarıda bırakın.</p>

                <svg class="illustration" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img"
                    aria-label="Soyut zihin ve psikoloji illüstrasyonu">
                    <defs>
                        <linearGradient id="g1" x1="0" x2="1">
                            <stop offset="0" stop-color="#9be7d6" />
                            <stop offset="1" stop-color="#a7c8ff" />
                        </linearGradient>
                        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="8" />
                        </filter>
                    </defs>
                    <g transform="translate(80,40)">
                        <ellipse cx="320" cy="180" rx="260" ry="130" fill="url(#g1)" opacity="0.12" />
                        <g filter="url(#blur)">
                            <path d="M150 200 C120 80, 420 40, 480 120 C560 220, 320 320, 150 260 Z" fill="#7ec8ff"
                                opacity="0.18" />
                            <path d="M200 160 C240 80, 360 80, 420 160 C460 210, 360 260, 220 240 Z" fill="#9be7d6"
                                opacity="0.28" />
                        </g>
                        <g stroke-opacity="0.9" stroke="#ffffff" stroke-width="2.2" fill="none" opacity="0.95">
                            <path d="M220 120 C230 100, 270 90, 300 110" />
                            <path d="M260 140 C280 130, 320 130, 350 150" />
                            <path d="M200 160 C220 150, 260 150, 300 180" />
                        </g>
                        <g fill="#ffffff" opacity="0.9">
                            <circle cx="120" cy="140" r="4" />
                            <circle cx="480" cy="100" r="3" />
                            <circle cx="360" cy="220" r="3.5" />
                        </g>
                        <path d="M280 180 C300 150, 360 150, 380 180 C400 210, 320 230, 280 180 Z" fill="#ffd6a5"
                            opacity="0.18" />
                        <circle cx="330" cy="170" r="6" fill="#ffb4a2" opacity="0.22" />
                    </g>
                </svg>

                <div class="bubbles" aria-hidden="true" id="bubbles"></div>
            </section>

            <section class="right">
                <div class="top-row">


                    <div>
                        <button class="theme-toggle" id="themeToggle" aria-pressed="false">🌙</button>
                    </div>
                </div>

                <form onsubmit="event.preventDefault();handleLogin();" aria-label="Giriş Formu">
                    <div>
                        <label for="email">E-posta</label>
                        <input id="email" type="email" placeholder="ornek@ornek.com" required />
                    </div>

                    <div>
                        <label for="password">Şifre</label>
                        <input id="password" type="password" placeholder="Şifreniz" required />
                    </div>

                    <div class="field-row" style="align-items:center;justify-content:space-between">
                        <label class="remember"><input type="checkbox" id="remember" /> Beni hatırla</label>
                        <button type="submit" class="btn">Giriş Yap</button>
                    </div>

                    <div class="alt">İlk kez mi? <a href="#">Hesap oluştur</a></div>
                </form>

                <div style="margin-top:6px;font-size:0.85rem;color:var(--muted)">Not: Verileriniz gizli tutulur.
                    Herhangi bir rahatsızlık hissederseniz işlemi durdurabilirsiniz.</div>
            </section>
        </main>
    </div>

    <script>
        const pageWrap = document.getElementById('pageWrap');
        const themeToggle = document.getElementById('themeToggle');
        const saved = localStorage.getItem('zy-theme');
        if (saved === 'dark') pageWrap.classList.add('dark');
        updateToggleIcon();

        themeToggle.addEventListener('click', () => {
            pageWrap.classList.toggle('dark');
            const isDark = pageWrap.classList.contains('dark');
            localStorage.setItem('zy-theme', isDark ? 'dark' : 'light');
            updateToggleIcon();
        });
        function updateToggleIcon() {
            const isDark = pageWrap.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            themeToggle.setAttribute('aria-pressed', String(isDark));
        }

        const bubblesEl = document.getElementById('bubbles');
        function makeBubble(delay, size, left) {
            const b = document.createElement('div');
            b.className = 'bubble';
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.left = left + 'px';
            b.style.bottom = '-10px';
            b.style.animationDelay = delay + 's';
            b.style.opacity = 0;
            bubblesEl.appendChild(b);
        }
        makeBubble(0, 28, 40);
        makeBubble(0.8, 18, 90);
        makeBubble(1.6, 34, 160);
        makeBubble(2.4, 22, 210);
        makeBubble(3.2, 16, 120);

        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!email || !pass) {
                alert('Lütfen e-posta ve şifre girin.');
                return;
            }

            // Giriş durumunu kaydet
            localStorage.setItem('drawMindIsLoggedIn', 'true');

            // 0.9 saniye sonra anasayfaya geç
            setTimeout(() => {
                window.location.href = "index.html";
            }, 900);
        }

    </script>
</body>

</html>
